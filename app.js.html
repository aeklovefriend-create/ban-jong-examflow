<script>
let APP={user:null,options:null,dashboard:null,academic:null,indicators:[]};
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const call=(fn,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(e))[fn](...args));
function toast(msg,error=false){const el=$('toast');el.textContent=msg;el.style.background=error?'#b42318':'#172b4d';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3600)}
function busy(on){$('loading').classList.toggle('hidden',!on)}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$('view-'+v).classList.remove('hidden');document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='dashboard')loadDashboard();if(v==='academic')loadAcademic();if(v==='reports')loadLogs();if(v==='admin')loadAdmin();}
function statusBadge(s,t){const c=String(s).toLowerCase().replaceAll(' ','-');return '<span class="status status-'+esc(c)+'">'+esc(t||s)+'</span>'}
function init(){busy(true);call('getCurrentUser').then(u=>{APP.user=u;if(!u.authorized){$('loading').innerHTML='<div style="text-align:center"><h2>ไม่สามารถเข้าใช้งานได้</h2><p>บัญชี Google นี้ยังไม่ได้รับอนุญาตใน Sheet Users</p><small>'+u.email+'</small></div>';return null}$('userName').textContent=u.name;$('userRole').textContent=u.role==='Admin'?'ผู้ดูแลระบบ':u.role==='Academic'?'ฝ่ายวิชาการ':'ครูผู้สอน';if(u.role!=='Teacher')document.querySelectorAll('.academic-only').forEach(x=>x.classList.remove('hidden'));if(u.role==='Admin')document.querySelectorAll('.admin-only').forEach(x=>x.classList.remove('hidden'));return Promise.all([call('getFormOptions'),loadDashboard()]);}).then(result=>{if(!result)return;APP.options=result[0];setupForm();$('app').classList.remove('hidden');busy(false)}).catch(e=>{busy(false);toast(e.message||'โหลดระบบไม่สำเร็จ',true)})}
function loadDashboard(){return call('getTeacherDashboard').then(d=>{APP.dashboard=d;renderStats(d);renderTeacherTable(d.submissions);$('progressLabel').textContent='ส่งแล้ว '+d.progress.submitted+'/'+d.progress.assigned+' รายวิชา';$('progressPercent').textContent=d.progress.percent+'%';$('progressBar').style.width=d.progress.percent+'%';$('deadlineText').textContent=deadlineText(d.settings.DEADLINE_END);})}
function deadlineText(end){if(!end)return '';const d=Math.ceil((new Date(end)-new Date())/86400000);return d>0?'กำหนดส่ง '+end+' · เหลือ '+d+' วัน':d===0?'วันนี้เป็นวันสุดท้าย': 'เลยกำหนด '+Math.abs(d)+' วัน'}
function renderStats(d){const isAcademic=APP.user&&APP.user.role!=='Teacher';const c=d.counts||{};const items=isAcademic?[['ข้อสอบทั้งหมด',Object.values(c).reduce((a,v)=>a+v,0),'blue'],['รอตรวจ',c['Under Review']||0,'orange'],['ให้แก้ไข',c['Need Revision']||0,'red'],['อนุมัติแล้ว',c['Approved']||0,'green'],['พร้อมพิมพ์',c['Ready to Print']||0,'navy']]:[['ต้องส่ง',c.Draft||0,'blue'],['ส่งแล้ว',c.Submitted||0,'orange'],['รอตรวจ',c['Under Review']||0,'orange'],['ให้แก้ไข',c['Need Revision']||0,'red'],['อนุมัติแล้ว',(c.Approved||0)+(c['Ready to Print']||0),'green']];$('stats').innerHTML=items.map(x=>'<div class="stat-card '+x[2]+'"><span class="label">'+x[0]+'</span><span class="value">'+x[1]+'</span></div>').join('')}
function renderTeacherTable(rows){$('teacherTable').querySelector('tbody').innerHTML=(rows||[]).map(s=>'<tr data-search="'+[s.SubjectName,s.SubjectCode,s.SubmissionID,s.Grade].join(' ').toLowerCase()+'"><td><strong>'+s.SubjectCode+'</strong><br><span class="muted">'+s.SubjectName+'</span></td><td>'+s.Grade+'</td><td>'+s.ExamType+'</td><td>'+s.dueDateText+'</td><td>'+s.submittedAtText+'</td><td>'+statusBadge(s.Status,s.statusTh)+'</td><td><button class="row-action" onclick="openDetail(\''+s.SubmissionID+'\')">ดูรายละเอียด</button></td></tr>').join('')||'<tr><td colspan="7" class="muted">ยังไม่มีรายการ</td></tr>'}
function loadAcademic(){return call('getAcademicDashboard',{}).then(d=>{APP.academic=d;const c=d.counts;$('academicStats').innerHTML=[['ทั้งหมด',c.total,'blue'],['รอตรวจ',c.underReview,'orange'],['ให้แก้ไข',c.needRevision,'red'],['อนุมัติแล้ว',c.approved,'green'],['พร้อมพิมพ์',c.readyToPrint,'navy']].map(x=>'<div class="stat-card '+x[2]+'"><span class="label">'+x[0]+'</span><span class="value">'+x[1]+'</span></div>').join('');$('academicTable').querySelector('tbody').innerHTML=d.submissions.map(s=>'<tr data-search="'+[s.SubmissionID,s.TeacherName,s.SubjectName,s.SubjectCode,s.Grade].join(' ').toLowerCase()+'"><td>'+s.SubmissionID+'</td><td>'+s.TeacherName+'</td><td>'+s.SubjectName+'</td><td>'+s.Grade+'</td><td>'+statusBadge(s.Status,s.statusTh)+'</td><td>'+s.UpdatedAt+'</td><td><button class="row-action" onclick="openReview(\''+s.SubmissionID+'\')">เปิดตรวจ</button></td></tr>').join('')||'<tr><td colspan="7">ไม่มีรายการ</td></tr>';})}
function filterTable(id,q){const needle=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>tr.style.display=(tr.dataset.search||tr.textContent.toLowerCase()).includes(needle)?'':'none')}
function syncSubject(){const o=APP.options.subjects.find(x=>x.SubjectCode===$('SubjectCode').value);if(o){$('SubjectName').value=o.SubjectName;$('SubjectGroup').value=o.SubjectGroup;loadIndicators()}}
function setupForm(){const o=APP.options;$('AcademicYear').value=o.settings.ACADEMIC_YEAR;$('Semester').value=o.settings.SEMESTER;$('SubjectCode').innerHTML='<option value="">เลือกวิชา</option>'+o.subjects.map(x=>'<option value="'+x.SubjectCode+'">'+x.SubjectCode+' · '+x.SubjectName+'</option>').join('');$('ExamType').innerHTML=o.examTypes.map(x=>'<option value="'+x.Name+'">'+x.Name+'</option>').join('');$('Grade').innerHTML='<option value="">เลือกระดับชั้น</option>'+[...new Set(o.classes.map(x=>x.Grade))].map(x=>'<option>'+x+'</option>').join('');$('mappingRows').innerHTML='';addMapping()}
function showViewSubmit(){if(APP.options)setupForm();showView('submit')}
function goStep(n){if(n===2){if(!validateStep1())return;saveDraftUi(true);loadIndicators();}document.getElementById('formStep1').classList.toggle('hidden',n!==1);document.getElementById('formStep2').classList.toggle('hidden',n!==2);document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.dataset.step==n))}
function validateStep1(){for(const id of ['AcademicYear','ExamType','SubjectCode','Grade','TotalQuestions','TotalScore','ExamDuration'])if(!$(id).value){toast('กรุณากรอกข้อมูลให้ครบ',true);$(id).focus();return false}return true}
function collectPayload(){return {SubmissionID:$('submissionId').value,AcademicYear:$('AcademicYear').value,Semester:$('Semester').value,ExamType:$('ExamType').value,SubjectCode:$('SubjectCode').value,SubjectName:$('SubjectName').value,Grade:$('Grade').value,Room:$('Room').value,TotalQuestions:$('TotalQuestions').value,TotalScore:$('TotalScore').value,ExamDuration:$('ExamDuration').value,StudentCount:$('StudentCount').value,CopyCount:$('CopyCount').value}}
function saveDraftUi(silent){if(!validateStep1())return;busy(true);call('saveDraft',collectPayload()).then(r=>{$('submissionId').value=r.submissionId;if(!silent)toast('บันทึกร่างแล้ว')}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function readFile(input){return new Promise((resolve,reject)=>{const f=input.files[0];if(!f)return reject(new Error('กรุณาเลือกไฟล์'));if(f.size>25*1024*1024)return reject(new Error('ไฟล์ใหญ่เกิน 25 MB'));const rd=new FileReader();rd.onload=()=>resolve({name:f.name,dataUrl:rd.result});rd.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));rd.readAsDataURL(f)})}
function showFile(input,id,progressId){$(id).textContent=input.files[0]?input.files[0].name:'ยังไม่ได้เลือกไฟล์';if(progressId&&$(progressId))$(progressId).value=input.files[0]?100:0}
function loadIndicators(){const grade=$('Grade').value,group=$('SubjectGroup').value;if(!grade)return;return call('listIndicators',{grade:grade,subjectGroup:group,query:$('indicatorSearch')&&$('indicatorSearch').value||''}).then(x=>{APP.indicators=x;renderMappingOptions()}).catch(e=>toast(e.message,true))}
function searchIndicators(){loadIndicators()}
function renderMappingOptions(){document.querySelectorAll('.indicator-select').forEach(sel=>{const val=sel.value;sel.innerHTML='<option value="">เลือกตัวชี้วัด</option>'+APP.indicators.sort((a,b)=>(a.type==='ปลายทาง'?0:1)-(b.type==='ปลายทาง'?0:1)).map(x=>'<option value="'+x.id+'">['+x.type+'] '+x.code+'</option>').join('');sel.value=val})}
function addMapping(){const div=document.createElement('div');div.className='mapping-row';div.innerHTML='<label>ข้อเริ่ม<input class="map-start" type="number" min="1" onchange="checkMappings()"></label><label>ข้อสุดท้าย<input class="map-end" type="number" min="1" onchange="checkMappings()"></label><label>ตัวชี้วัด<select class="indicator-select" onchange="checkMappings()"><option value="">เลือกตัวชี้วัด</option></select></label><button type="button" class="remove-map" onclick="this.parentElement.remove();checkMappings()">×</button>';$('mappingRows').appendChild(div);renderMappingOptions()}
function collectMappings(){return [...document.querySelectorAll('.mapping-row')].map(r=>({startItem:Number(r.querySelector('.map-start').value),endItem:Number(r.querySelector('.map-end').value),indicatorId:r.querySelector('.indicator-select').value})).filter(x=>x.startItem&&x.endItem&&x.indicatorId)}
function checkMappings(){const n=Number($('TotalQuestions').value||0),ms=collectMappings(),covered=[];ms.forEach(m=>{for(let i=m.startItem;i<=m.endItem;i++)covered.push(i)});const dup=covered.filter((x,i)=>covered.indexOf(x)!==i),missing=[];for(let i=1;i<=n;i++)if(!covered.includes(i))missing.push(i);const el=$('mappingSummary');if(dup.length||missing.length){el.className='mapping-summary bad';el.textContent=dup.length?'มีข้อสอบซ้ำ: '+[...new Set(dup)].join(', '):'ยังไม่ได้กำหนด: '+missing.join(', ')}else if(n&&covered.length===n){el.className='mapping-summary ok';el.textContent='กำหนดตัวชี้วัดครบ '+n+' ข้อแล้ว'}else{el.className='mapping-summary';el.textContent='กำหนดแล้ว '+covered.length+'/'+n+' ข้อ'}}
async function submitExamUi(){try{if(!validateStep1())return;const q=await readFile($('questionFile')),a=await readFile($('answerFile'));const ms=collectMappings();checkMappings();if(ms.length===0){toast('กรุณากำหนดตัวชี้วัด',true);return}busy(true);const r=await call('submitSubmission',{...collectPayload(),questionFile:q,answerFile:a,mappings:ms,comment:$('submitComment').value});toast('ส่งข้อสอบเรียบร้อยแล้ว '+r.submissionId);$('submitForm').reset();$('mappingRows').innerHTML='';$('submissionId').value='';goStep(1);showView('dashboard');}catch(e){toast(e.message||'ส่งข้อสอบไม่สำเร็จ',true)}finally{busy(false)}}
function openDetail(id){busy(true);call('getSubmissionDetail',id).then(d=>{const s=d.submission;const actions=(s.Status==='Need Revision'?'<button class="danger" onclick="editRevision(\''+s.SubmissionID+'\')">แก้ไขและส่ง V'+(Number(s.CurrentVersion)+1)+'</button>':'')+(s.CoverFileId?'<button class="primary" onclick="getCover(\''+s.SubmissionID+'\')">เปิดใบปะหน้า / PDF</button>':'');$('modalContent').innerHTML='<h2>'+s.SubjectName+' · '+s.SubmissionID+'</h2><p>'+statusBadge(s.Status,s.statusTh)+'</p><div class="review-meta">ครูผู้สอน: '+s.TeacherName+'<br>ชั้น: '+s.Grade+' · จำนวนข้อ: '+s.TotalQuestions+'<br>เวอร์ชันปัจจุบัน: V'+s.CurrentVersion+'<br>ความคิดเห็น: '+(s.LastComment||'-')+'</div><h3>ไฟล์</h3>'+(d.files||[]).map(f=>'<p><a href="'+f.url+'" target="_blank">'+f.fileName+'</a></p>').join('')+'<h3>ตัวชี้วัด</h3>'+d.blueprint.rows.map(r=>'<p>'+r.items.join(', ')+' · '+r.code+' · '+r.count+' ข้อ</p>').join('')+'<div class="form-actions">'+actions+'</div>';$('modal').classList.remove('hidden')}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function editRevision(id){closeModal();busy(true);call('getSubmissionDetail',id).then(d=>{const s=d.submission;showViewSubmit();['AcademicYear','Semester','ExamType','SubjectCode','SubjectName','Grade','Room','TotalQuestions','TotalScore','ExamDuration','StudentCount','CopyCount'].forEach(k=>{if($(k))$(k).value=s[k]||''});$('submissionId').value=id;goStep(2);return loadIndicators().then(()=>{ $('mappingRows').innerHTML=''; (d.mappings||[]).forEach(m=>{addMapping();const row=$('mappingRows').lastElementChild;row.querySelector('.map-start').value=m.startItem;row.querySelector('.map-end').value=m.endItem;row.querySelector('.indicator-select').value=m.indicatorId;});checkMappings();toast('แนบไฟล์ฉบับแก้ไข แล้วกดส่งข้อสอบ')})}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function openReview(id){busy(true);call('startReview',id).then(d=>{const s=d.submission;const checks=[['FormatOk','รูปแบบข้อสอบถูกต้อง'],['QuestionCountOk','จำนวนข้อถูกต้อง'],['ScoreOk','คะแนนถูกต้อง'],['InstructionOk','คำสั่งชัดเจน'],['LanguageOk','ภาษาเหมาะสมกับระดับชั้น'],['OptionsOk','ตัวเลือกไม่กำกวม'],['AnswerKeyOk','มีเฉลยครบ'],['IndicatorAlignmentOk','ตัวชี้วัดสอดคล้อง'],['CoverageOk','ครอบคลุมตัวชี้วัด'],['PrivacyOk','ไม่มีข้อมูลส่วนบุคคล'],['ReadyOk','พร้อมนำไปใช้สอบ']];const printActions=s.Status==='Ready to Print'?'<button class="primary" onclick="queuePrintUi(\''+s.SubmissionID+'\')">รับเข้าคิวพิมพ์</button><button class="ghost" onclick="markPrintedUi(\''+s.SubmissionID+'\')">พิมพ์แล้ว</button>':s.Status==='Printed'?'<button class="primary" onclick="completeUi(\''+s.SubmissionID+'\')">ปิดงานเสร็จสิ้น</button>':'';$('modalContent').innerHTML='<h2>ตรวจข้อสอบ · '+s.SubmissionID+'</h2><div class="review-grid"><div><div class="review-meta">'+s.TeacherName+'<br>'+s.SubjectCode+' '+s.SubjectName+' · '+s.Grade+'<br>เวอร์ชัน V'+s.CurrentVersion+'</div><h3>ไฟล์</h3>'+(d.files||[]).map(f=>'<p><a href="'+f.url+'" target="_blank">'+f.fileName+'</a></p>').join('')+'</div><div><div class="checklist">'+checks.map(c=>'<label><input type="checkbox" class="review-check" value="'+c[0]+'">'+c[1]+'</label>').join('')+'</div><textarea id="reviewComment" rows="5" style="width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px" placeholder="ข้อเสนอแนะจากฝ่ายวิชาการ"></textarea><div class="form-actions"><button class="danger" onclick="saveReviewUi(\''+s.SubmissionID+'\',\'revision\')">ส่งกลับแก้ไข</button><button class="primary" onclick="saveReviewUi(\''+s.SubmissionID+'\',\'approve\')">อนุมัติข้อสอบ</button>'+printActions+'</div></div></div>';$('modal').classList.remove('hidden')}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function saveReviewUi(id,action){if(action==='approve'&&!confirm('ยืนยันอนุมัติข้อสอบรายการนี้?'))return;const p={SubmissionID:id,action,Comment:$('reviewComment').value};document.querySelectorAll('.review-check').forEach(x=>p[x.value]=x.checked);busy(true);call('saveReview',p).then(()=>{toast(action==='approve'?'อนุมัติแล้ว':'ส่งกลับแก้ไขแล้ว');closeModal();loadAcademic();}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function queuePrintUi(id){const copies=Number(prompt('จำนวนชุดที่ต้องการพิมพ์', '1'));if(!copies)return;busy(true);call('queueForPrint',id,copies).then(()=>{toast('รับเข้าคิวพิมพ์แล้ว');closeModal();loadAcademic()}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function markPrintedUi(id){const copies=Number(prompt('จำนวนชุดที่พิมพ์จริง','1'));if(!copies)return;busy(true);call('markPrinted',id,copies,'บันทึกจากหน้า Review').then(()=>{toast('บันทึกพิมพ์แล้ว');closeModal();loadAcademic()}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function completeUi(id){if(!confirm('ยืนยันปิดงานรายการนี้?'))return;busy(true);call('markCompleted',id).then(()=>{toast('ปิดงานแล้ว');closeModal();loadAcademic()}).catch(e=>toast(e.message,true)).finally(()=>busy(false))}
function getCover(id){call('getCoverPdf',id).then(r=>window.open(r.pdfUrl,'_blank')).catch(e=>toast(e.message,true))}
function closeModal(){$('modal').classList.add('hidden');$('modalContent').innerHTML=''}
function loadLogs(){call('getActivityLogs',100).then(rows=>{$('logsTable').querySelector('tbody').innerHTML=rows.map(r=>'<tr><td>'+r.CreatedAt+'</td><td>'+r.ActorName+'</td><td>'+r.Action+'</td><td>'+r.EntityID+'</td><td>'+r.Details+'</td></tr>').join('')})}
function exportCsv(){call('exportSubmissionsCsv',{}).then(r=>window.open(r.url,'_blank')).catch(e=>toast(e.message,true))}
function importIndicatorsUi(){try{const rows=JSON.parse($('indicatorJson').value);busy(true);call('importIndicators',rows).then(()=>toast('นำเข้าตัวชี้วัดแล้ว')).catch(e=>toast(e.message,true)).finally(()=>busy(false))}catch(e){toast('JSON ไม่ถูกต้อง',true)}}
function loadAdmin(){call('adminGetConfiguration').then(c=>{$('settingsJson').value=JSON.stringify(Object.fromEntries((c.settings||[]).map(x=>[x.Key,x.Value])),null,2)}).catch(e=>toast(e.message,true))}
function saveSettingsUi(){try{const o=JSON.parse($('settingsJson').value);busy(true);Promise.all(Object.keys(o).map(k=>call('adminSaveSetting',k,o[k],'แก้จากหน้า Admin'))).then(()=>toast('บันทึกการตั้งค่าแล้ว')).catch(e=>toast(e.message,true)).finally(()=>busy(false))}catch(e){toast('JSON ไม่ถูกต้อง',true)}}
function clearSamplesUi(){if(!confirm('ล้างข้อมูลตัวอย่างและรายการที่เกี่ยวข้อง?'))return;call('clearSampleData').then(()=>{toast('ล้างข้อมูลแล้ว');refreshApp()}).catch(e=>toast(e.message,true))}
function initPublicStatus(id){busy(true);call('getPublicStatus',id).then(s=>{$('loading').innerHTML='<div style="max-width:420px;width:90%;background:#fff;padding:30px;border-radius:16px;text-align:center"><div class="brand-mark" style="margin:0 auto 15px">BJ</div><h2>'+s.schoolName+'</h2><p>'+s.subjectCode+' · '+s.subjectName+' · '+s.grade+'</p><div>'+statusBadge(s.status,s.statusTh)+'</div><p class="muted" style="margin-top:15px">Submission ID: '+s.submissionId+'<br>เวอร์ชัน V'+s.version+' · อัปเดต '+s.updatedAt+'</p></div>';}).catch(e=>{$('loading').innerHTML='<div>ไม่พบรายการข้อสอบ</div>'})}
function refreshApp(){location.reload()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('[data-view="submit"]').onclick=()=>showViewSubmit();let timer;document.querySelectorAll('#submitForm input,#submitForm select,#submitForm textarea').forEach(el=>el.addEventListener('change',()=>{clearTimeout(timer);timer=setTimeout(()=>{if($('AcademicYear').value&&$('SubjectCode').value&&$('TotalQuestions').value)saveDraftUi(true)},900)}));const id=new URLSearchParams(location.search).get('submission');if(id)initPublicStatus(id);else init()});
</script>
